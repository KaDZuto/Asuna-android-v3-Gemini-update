<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Asuna VectorHeart</title>
<link rel="stylesheet" href="style.css" />
<style>
  /* Скрываем miniToolbar (все управление перенесено в Compose, но app.js ищет
     эти кнопки по getElementById — поэтому создаём их невидимыми). */
  #miniToolbar { display: none !important; }
  #chip { display: none !important; }
  body { background: transparent; }
  #petZone { background: transparent; }
  canvas { background: transparent; }
</style>
</head>
<body class="pet-body">

  <!-- Полноэкранная зона питомца: драг окна + клик-реакции -->
  <div id="petZone">
    <svg id="aura" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <radialGradient id="auraRed" cx="50%" cy="50%" r="55%">
          <stop offset="0%" stop-color="#e0402a" stop-opacity="0.38"/>
          <stop offset="100%" stop-color="#e0402a" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="auraInk" cx="50%" cy="50%" r="55%">
          <stop offset="0%" stop-color="#16130d" stop-opacity="0.22"/>
          <stop offset="100%" stop-color="#16130d" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="auraCream" cx="50%" cy="50%" r="55%">
          <stop offset="0%" stop-color="#f1e9d3" stop-opacity="0.32"/>
          <stop offset="100%" stop-color="#f1e9d3" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <ellipse id="blobA" cx="46" cy="62" rx="30" ry="26" fill="url(#auraRed)"/>
      <ellipse id="blobB" cx="58" cy="48" rx="26" ry="30" fill="url(#auraInk)"/>
      <ellipse id="blobC" cx="40" cy="42" rx="22" ry="20" fill="url(#auraCream)"/>
    </svg>
    <canvas id="live2d-canvas"></canvas>
  </div>

  <!-- Скрытые элементы, которые ищет оригинальный app.js через getElementById -->
  <div id="chip" style="display:none">
    <span id="chipDot"></span>
    <span id="chipLabel">ASUNA</span>
  </div>
  <div id="miniToolbar" style="display:none">
    <button id="btnOpenControl"></button>
    <button id="btnMic"></button>
    <button id="btnPin"></button>
    <button id="btnHide"></button>
    <button id="btnQuit"></button>
    <button id="btnPlayer"></button>
  </div>

  <script src="lib/pixi.min.js"></script>
  <script src="lib/live2d.min.js"></script>
  <script src="lib/cubism2.min.js"></script>
  <script src="motion-engine.js"></script>
  <script src="gestures.js"></script>
  <script src="asuna-shim.js"></script>
  <script src="app.js"></script>
  <script src="tilt-physics.js"></script>
</body>
</html>
