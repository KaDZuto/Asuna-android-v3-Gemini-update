<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data: 'unsafe-inline' 'unsafe-eval'; script-src 'self' file: 'unsafe-inline' 'unsafe-eval'; media-src 'self' file: data: blob:;">
  <title>ASUNA — SAO Player</title>
  <link rel="stylesheet" href="sao-theme.css">
</head>
<body class="sao-theme">
  <div class="sao-player">
    <div class="sao-player-header">
      <h2> MUSIC PLAYER</h2>
      <button class="sao-close-btn" onclick="window.close()">✕</button>
    </div>
    <div class="sao-player-list" id="playlist">
      <div class="sao-empty">Загрузка...</div>
    </div>
    <div class="sao-player-controls">
      <button id="prevBtn" title="Предыдущий">⏮</button>
      <button id="playBtn" class="sao-play-btn" title="Воспроизвести/Пауза">▶</button>
      <button id="nextBtn" title="Следующий">⏭</button>
      <div class="sao-player-volume">
        <span></span>
        <input type="range" id="volumeSlider" min="0" max="100" value="80">
        <span class="sao-volume-label" id="volumeLabel">80%</span>
      </div>
    </div>
  </div>
  <audio id="audioPlayer" style="display:none"></audio>
  <script src="player-sao.js"></script>
</body>
</html>
