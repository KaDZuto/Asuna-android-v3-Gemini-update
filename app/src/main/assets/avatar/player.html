<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data: 'unsafe-inline' 'unsafe-eval'; script-src 'self' file: 'unsafe-inline' 'unsafe-eval'; img-src 'self' file: data:; connect-src 'self' file: https: http: ws:; media-src 'self' file: data: blob:;" />
  <title>Музыкальный плеер</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #1a1815;
      color: #e8e0d4;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      overflow: hidden;
    }
    .header {
      padding: 16px 20px 10px 20px;
      border-bottom: 1px solid #2f2a24;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #f1e9d3;
    }
    .header .close-btn {
      background: none;
      border: none;
      color: #887e6e;
      font-size: 20px;
      cursor: pointer;
      padding: 0 8px;
      line-height: 1;
      transition: color 0.2s;
    }
    .header .close-btn:hover {
      color: #e8e0d4;
    }
    .player-controls {
      padding: 20px 20px 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex-shrink: 0;
    }
    .track-info {
      text-align: center;
      min-height: 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .track-info .title {
      font-size: 15px;
      font-weight: 500;
      color: #f1e9d3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-info .artist {
      font-size: 12px;
      color: #887e6e;
      margin-top: 2px;
    }
    .progress-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .progress-container .time {
      font-size: 11px;
      color: #887e6e;
      font-variant-numeric: tabular-nums;
      min-width: 36px;
    }
    .progress-bar {
      flex: 1;
      height: 4px;
      background: #2f2a24;
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }
    .progress-bar .fill {
      height: 100%;
      width: 0%;
      background: #b8a48c;
      border-radius: 2px;
      transition: width 0.05s linear;
    }
    .progress-bar .fill.dragging {
      transition: none;
    }
    .controls-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }
    .controls-row button {
      background: none;
      border: none;
      color: #c8bca8;
      font-size: 22px;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .controls-row button:hover {
      background: #2f2a24;
      color: #f1e9d3;
    }
    .controls-row button.play-btn {
      font-size: 30px;
      width: 48px;
      height: 48px;
      background: #3d352c;
      color: #f1e9d3;
    }
    .controls-row button.play-btn:hover {
      background: #4f4538;
    }
    .controls-row button:active {
      transform: scale(0.94);
    }
    .volume-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 4px;
    }
    .volume-row .vol-icon {
      color: #887e6e;
      font-size: 16px;
      min-width: 20px;
    }
    .volume-row input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: #2f2a24;
      border-radius: 2px;
      outline: none;
    }
    .volume-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #b8a48c;
      cursor: pointer;
    }
    .playlist {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px 20px 16px;
      border-top: 1px solid #2f2a24;
      margin-top: 4px;
    }
    .playlist .playlist-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
      color: #c8bca8;
    }
    .playlist .playlist-item:hover {
      background: #2f2a24;
      color: #f1e9d3;
    }
    .playlist .playlist-item.active {
      background: #3d352c;
      color: #f1e9d3;
    }
    .playlist .playlist-item .idx {
      font-size: 11px;
      color: #5f5548;
      min-width: 24px;
    }
    .playlist .playlist-item .name {
      flex: 1;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .playlist .playlist-item .duration {
      font-size: 11px;
      color: #5f5548;
    }
    .empty-playlist {
      text-align: center;
      color: #5f5548;
      padding: 40px 20px;
      font-size: 14px;
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #3d352c;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4f4538;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1> Плеер</h1>
    <button class="close-btn" id="closeBtn">✕</button>
  </div>
  <div class="player-controls">
    <div class="track-info">
      <div class="title" id="trackTitle">Нет трека</div>
      <div class="artist" id="trackArtist">—</div>
    </div>
    <div class="progress-container">
      <span class="time" id="currentTime">0:00</span>
      <div class="progress-bar" id="progressBar">
        <div class="fill" id="progressFill"></div>
      </div>
      <span class="time" id="durationTime">0:00</span>
    </div>
    <div class="controls-row">
      <button id="prevBtn" title="Предыдущий">⏮</button>
      <button class="play-btn" id="playBtn" title="Воспроизвести / Пауза">▶</button>
      <button id="nextBtn" title="Следующий">⏭</button>
    </div>
    <div class="volume-row">
      <span class="vol-icon"></span>
      <input type="range" id="volumeSlider" min="0" max="100" value="80" />
    </div>
  </div>
  <div class="playlist" id="playlistContainer">
    <div class="empty-playlist">Плейлист пуст. Добавьте музыку через панель управления.</div>
  </div>
  <script src="player.js"></script>
</body>
</html>
